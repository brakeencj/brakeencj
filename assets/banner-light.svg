<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Cervantes terminal profile</title>
  <desc id="desc">A terminal window showing Gabriel Cervantes, Engineering Tech Lead, and his technical focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff8ff"/>
      <stop offset="1" stop-color="#e5efff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="190" fill="#0ea5e9" opacity="0.07"/>
  <circle cx="110" cy="360" r="180" fill="#2563eb" opacity="0.07"/>
  <rect x="65" y="42" width="1070" height="306" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="42" width="1070" height="52" rx="18" fill="#e8f0fa"/>
  <rect x="65" y="76" width="1070" height="18" fill="#e8f0fa"/>
  <circle cx="96" cy="68" r="7" fill="#ff5f57"/>
  <circle cx="119" cy="68" r="7" fill="#febc2e"/>
  <circle cx="142" cy="68" r="7" fill="#28c840"/>
  <text x="600" y="74" text-anchor="middle" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">profile.sh — live</text>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="21">
    <text x="104" y="137" fill="#0891b2">gabriel@engineering</text><text x="335" y="137" fill="#64748b">:</text><text x="348" y="137" fill="#2563eb">~</text><text x="365" y="137" fill="#1e293b">$ whoami</text>
    <text x="104" y="174" fill="#0f172a">Gabriel Cervantes</text>
    <text x="104" y="218" fill="#0891b2">gabriel@engineering</text><text x="335" y="218" fill="#64748b">:</text><text x="348" y="218" fill="#2563eb">~</text><text x="365" y="218" fill="#1e293b">$ role --current</text>
    <text x="104" y="255" fill="url(#accent)" font-weight="700">Engineering Tech Lead</text>
    <text x="104" y="299" fill="#0891b2">gabriel@engineering</text><text x="335" y="299" fill="#64748b">:</text><text x="348" y="299" fill="#2563eb">~</text><text x="365" y="299" fill="#1e293b">$ focus</text>
    <text x="104" y="330" fill="#475569" font-size="18">distributed systems · cloud · integrations · reliable delivery</text>
  </g>
</svg>
