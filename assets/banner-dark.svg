<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Cervantes terminal profile</title>
  <desc id="desc">A terminal window showing Gabriel Cervantes, Engineering Tech Lead, and his technical focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="190" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="110" cy="360" r="180" fill="#2563eb" opacity="0.06"/>
  <rect x="65" y="42" width="1070" height="306" rx="18" fill="#0d1117" stroke="#23334a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="42" width="1070" height="52" rx="18" fill="#121a26"/>
  <rect x="65" y="76" width="1070" height="18" fill="#121a26"/>
  <circle cx="96" cy="68" r="7" fill="#ff5f57"/>
  <circle cx="119" cy="68" r="7" fill="#febc2e"/>
  <circle cx="142" cy="68" r="7" fill="#28c840"/>
  <text x="600" y="74" text-anchor="middle" fill="#8293a8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15">profile.sh — live</text>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="21">
    <text x="104" y="137" fill="#22d3ee">gabriel@engineering</text><text x="335" y="137" fill="#8293a8">:</text><text x="348" y="137" fill="#60a5fa">~</text><text x="365" y="137" fill="#e2e8f0">$ whoami</text>
    <text x="104" y="174" fill="#f8fafc">Gabriel Cervantes</text>
    <text x="104" y="218" fill="#22d3ee">gabriel@engineering</text><text x="335" y="218" fill="#8293a8">:</text><text x="348" y="218" fill="#60a5fa">~</text><text x="365" y="218" fill="#e2e8f0">$ role --current</text>
    <text x="104" y="255" fill="url(#accent)" font-weight="700">Engineering Tech Lead</text>
    <text x="104" y="299" fill="#22d3ee">gabriel@engineering</text><text x="335" y="299" fill="#8293a8">:</text><text x="348" y="299" fill="#60a5fa">~</text><text x="365" y="299" fill="#e2e8f0">$ focus</text>
    <text x="104" y="330" fill="#a9b8ca" font-size="18">distributed systems · cloud · integrations · reliable delivery</text>
